name: AuraOS CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            nasm \
            gnu-efi \
            mtools \
            qemu-system-x86 \
            ovmf

      - name: Prepare OVMF
        run: |
          set -euo pipefail
          CODE_SRC="$(find /usr/share /usr/lib -type f \( -name 'OVMF_CODE.fd' -o -name 'OVMF_CODE_4M.fd' \) -print -quit)"
          if [ -z "$CODE_SRC" ]; then
            echo "ERROR: OVMF_CODE.fd no encontrado tras instalar ovmf"
            exit 1
          fi
          cp "$CODE_SRC" OVMF_CODE.fd
          if [ ! -f OVMF_VARS.fd ]; then
            VARS_SRC="$(find /usr/share /usr/lib -type f \( -name 'OVMF_VARS.fd' -o -name 'OVMF_VARS_4M.fd' \) -print -quit)"
            if [ -z "$VARS_SRC" ]; then
              echo "ERROR: OVMF_VARS.fd no existe en el repositorio ni en el sistema"
              exit 1
            fi
            cp "$VARS_SRC" OVMF_VARS.fd
          fi
          ls -lh OVMF_CODE.fd OVMF_VARS.fd

      - name: Build AuraOS
        run: make clean && make

      - name: Boot and memory stress test in QEMU
        run: |
          set -o pipefail
          set +e
          timeout --signal=TERM 20s make run 2>&1 | tee qemu.log
          status=${PIPESTATUS[0]}
          set -e

          # Always resolve kernel RIPs when an exception was reported. This lets
          # us map a bare-metal fault directly back to the source line without
          # requiring a local toolchain on the developer machine.
          if grep -q '\[!] EXCEPCION #' qemu.log; then
            echo "===== AuraOS exception symbolication ====="
            while IFS= read -r rip; do
              if [ -n "$rip" ]; then
                echo "RIP=$rip"
                addr2line -e kernel/kernel.elf -f -C "$rip" || true
                objdump -d --no-show-raw-insn --start-address="$rip" --stop-address=$((rip + 16)) kernel/kernel.elf || true
              fi
            done < <(sed -n 's/.*RIP: \(0x[0-9A-Fa-f]*\).*/\1/p' qemu.log)
            echo "===== End exception symbolication ====="
          fi

          if [ "$status" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $status"
            cat qemu.log
            exit 1
          fi

          grep -Fq "[PMM] Bitmap" qemu.log
          grep -Fq "[HEAP] Heap inicializado" qemu.log
          grep -Fq "[INIT] Iniciando Scheduler" qemu.log
          grep -Fq "[INIT] Aurora OS listo. Multitarea activa." qemu.log
          grep -Fq "[SELFTEST][PMM] 256 alloc/write/verify/free: OK" qemu.log
          grep -Fq "[SELFTEST][HEAP] allocation isolation: OK" qemu.log
          grep -Fq "[SELFTEST][HEAP] 128 isolation/fragmentation/reuse cycles: OK" qemu.log
          grep -Fq "[SELFTEST] Todos los tests de memoria: OK" qemu.log

          if grep -Eq '\[SELFTEST\].*(FAIL|FALLO)|\[PMM\] ERROR|\[HEAP\] (ERROR|CORRUPCION)' qemu.log; then
            echo "Memory integrity failure detected"
            cat qemu.log
            exit 1
          fi

          if grep -q '\[!] EXCEPCION #' qemu.log; then
            echo "AuraOS reported a CPU exception"
            cat qemu.log
            exit 1
          fi

          echo "AuraOS boot + memory stress test: OK"
